name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.5.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        include:
          - os: macos-latest
            platform: mac
            artifact_name: mac
          - os: windows-latest
            platform: win
            artifact_name: win
          - os: ubuntu-latest
            platform: linux
            artifact_name: linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: npm install
        timeout-minutes: 15
        continue-on-error: false

      - name: Install dependencies (macOS/Linux)
        if: matrix.os != 'windows-latest'
        run: npm ci
        timeout-minutes: 10

      - name: Build for ${{ matrix.platform }}
        timeout-minutes: 30
        run: |
          # Unset GitHub tokens to prevent electron-builder from auto-publishing
          unset GH_TOKEN
          unset GITHUB_TOKEN
          npm run build:desktop:${{ matrix.platform }}
        env:
          # Disable electron-builder auto-publish and code signing
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CI: false
          # Increase timeout for DMG creation
          ELECTRON_BUILDER_CACHE: /tmp/electron-builder-cache

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-build
          path: dist/
          retention-days: 30
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-assets
          # Find and copy all build artifacts (installers, zips, blockmaps)
          find artifacts -type f \( \
            -name "*.dmg" -o \
            -name "*.zip" -o \
            -name "*.exe" -o \
            -name "*.AppImage" -o \
            -name "*.deb" -o \
            -name "*.blockmap" \
          \) -not -path "*/node_modules/*" -exec cp {} release-assets/ \;
          echo "Found release assets:"
          ls -lh release-assets/ || echo "Warning: No release assets found!"
          if [ ! "$(ls -A release-assets)" ]; then
            echo "Error: No release assets to upload!"
            exit 1
          fi

      - name: Get tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Tag to use: ${TAG}"

      - name: Check release assets
        run: |
          echo "Release assets to upload:"
          ls -lh release-assets/ || echo "No release-assets directory found"
          find release-assets -type f || echo "No files found in release-assets"

      - name: Update or Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: release-assets/*
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

